name: Firmware and UI checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python3 tools/embed_web.py --check
      - run: python3 tests/check_dcc.py
      - run: |
          python3 tools/draw_hardware.py
          git diff --exit-code -- docs/hardware
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: '1.x'
      - name: Install tested Pico core
        run: |
          arduino-cli core update-index --additional-urls https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json
          arduino-cli core install rp2040:rp2040@6.3.1 --additional-urls https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json
      - name: Compile Pico W
        run: arduino-cli compile --fqbn rp2040:rp2040:rpipicow:flash=2097152_1048576 --output-dir build firmware/anden-dcc
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci --prefix tools/ui-tests
      - run: npx --prefix tools/ui-tests playwright install --with-deps chromium
      - run: npm test --prefix tools/ui-tests
