<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850">
<rect width="1200" height="850" fill="#fffef9"/>
<style>text{font-family:Arial,sans-serif;fill:#142d32} .mono{font-family:monospace}</style>
<text x="42" y="40" font-size="14" fill="#142d32" style="fill:#142d32" font-weight="bold" text-anchor="start">anden-dcc / HARDWARE</text>
<text x="1158" y="40" font-size="13" fill="#142d32" style="fill:#142d32" font-weight="normal" text-anchor="end">03 / REV A</text>
<text x="42" y="86" font-size="29" fill="#142d32" style="fill:#142d32" font-weight="bold" text-anchor="start">Trip once. Stay off.</text>
<text x="42" y="116" font-size="13" fill="#647676" style="fill:#647676" font-weight="normal" text-anchor="start">Proposed asynchronous current trip · explicit edge to arm · power-on reset · hardware emergency stop</text>
<path d="M42 139H1158V139" fill="none" stroke="#d7dfd6" stroke-width="1"/>
<rect x="42" y="768" width="1116" height="47" rx="8" fill="#f8e9da" stroke="#d7dfd6"/>
<text x="58" y="790" font-size="12" fill="#a34030" style="fill:#a34030" font-weight="bold" text-anchor="start">PROPOSED POWER ASSEMBLY · NOT BUILT OR ELECTRICALLY VALIDATED</text>
<text x="58" y="807" font-size="11" fill="#142d32" style="fill:#142d32" font-weight="normal" text-anchor="start">Firmware 0.5.0 drives GP2 only. Other pins are reservations. See hardware README and sources before assembly.</text>
<rect x="46" y="180" width="260" height="144" rx="10" fill="#f4f2eb" stroke="#d7dfd6"/>
<text x="61" y="207" font-size="15" fill="#142d32" style="fill:#142d32" font-weight="bold" text-anchor="start">U3 · LM393 (PDIP-8)</text>
<text x="61" y="231" font-size="12" fill="#142d32" style="fill:#142d32" font-weight="normal" text-anchor="start">VCC 8 = +5V; GND 4 = GND</text>
<text x="61" y="251" font-size="12" fill="#142d32" style="fill:#142d32" font-weight="normal" text-anchor="start">Pin 2 (−) = divided SNSA</text>
<text x="61" y="271" font-size="12" fill="#142d32" style="fill:#142d32" font-weight="normal" text-anchor="start">Pin 6 (−) = divided SNSB</text>
<text x="61" y="291" font-size="12" fill="#142d32" style="fill:#142d32" font-weight="normal" text-anchor="start">Pins 3, 5 (+) = VREF</text>
<path d="M306 246H375V246" fill="none" stroke="#142d32" stroke-width="2"/>
<text x="318" y="233" font-size="11" fill="#142d32" style="fill:#142d32" font-weight="normal" text-anchor="start">OUT 1, 7</text>
<path d="M375 246H737V290H805" fill="none" stroke="#142d32" stroke-width="2.5"/>
<circle cx="526" cy="246" r="3.5" fill="#142d32"/>
<text x="499" y="226" font-size="12" fill="#142d32" style="fill:#142d32" font-weight="bold" text-anchor="start">CLEAR_N / U2 pin 1</text>
<rect x="805" y="180" width="348" height="242" rx="10" fill="#f4f2eb" stroke="#d7dfd6"/>
<text x="820" y="207" font-size="15" fill="#142d32" style="fill:#142d32" font-weight="bold" text-anchor="start">U2 · 74HCT74 (PDIP-14)</text>
<text x="820" y="231" font-size="12" fill="#142d32" style="fill:#142d32" font-weight="normal" text-anchor="start">VCC 14 = +5V; GND 7 = GND</text>
<text x="820" y="251" font-size="12" fill="#142d32" style="fill:#142d32" font-weight="normal" text-anchor="start">D1 pin 2 = +5V; /PRE1 pin 4 = +5V</text>
<text x="820" y="271" font-size="12" fill="#142d32" style="fill:#142d32" font-weight="normal" text-anchor="start">CLK1 pin 3 = GP4 / ARM (10 kΩ down)</text>
<text x="820" y="291" font-size="12" fill="#142d32" style="fill:#142d32" font-weight="normal" text-anchor="start">Q1 pin 5 unused</text>
<text x="820" y="311" font-size="12" fill="#142d32" style="fill:#142d32" font-weight="normal" text-anchor="start">/Q1 pin 6 → BUFFER_DISABLE</text>
<text x="820" y="331" font-size="12" fill="#142d32" style="fill:#142d32" font-weight="normal" text-anchor="start">10 kΩ OE pull-up to +5V at U1</text>
<path d="M990 422H990V460" fill="none" stroke="#437d65" stroke-width="2"/>
<text x="804" y="455" font-size="12" fill="#437d65" style="fill:#437d65" font-weight="normal" text-anchor="start">BUFFER_DISABLE → all U1 OE pins</text>
<text x="804" y="477" font-size="12" fill="#142d32" style="fill:#142d32" font-weight="normal" text-anchor="start">Also divide 10 kΩ / 10 kΩ → GP28 / pin 34</text>
<text x="804" y="499" font-size="11" fill="#647676" style="fill:#647676" font-weight="normal" text-anchor="start">(1 nF to GND at midpoint; feedback only)</text>
<rect x="46" y="370" width="254" height="169" rx="10" fill="#f4f2eb" stroke="#d7dfd6"/>
<text x="61" y="397" font-size="15" fill="#142d32" style="fill:#142d32" font-weight="bold" text-anchor="start">U4 · MCP120-485</text>
<text x="61" y="421" font-size="12" fill="#142d32" style="fill:#142d32" font-weight="normal" text-anchor="start">+5V / GND; RST → CLEAR_N</text>
<text x="61" y="441" font-size="12" fill="#142d32" style="fill:#142d32" font-weight="normal" text-anchor="start">Open drain; verify package</text>
<text x="61" y="461" font-size="12" fill="#142d32" style="fill:#142d32" font-weight="normal" text-anchor="start">bondout before wiring.</text>
<text x="61" y="481" font-size="12" fill="#142d32" style="fill:#142d32" font-weight="normal" text-anchor="start">Reset at power-up/brownout.</text>
<text x="61" y="501" font-size="12" fill="#142d32" style="fill:#142d32" font-weight="normal" text-anchor="start">S1 NO: CLEAR_N → GND</text>
<path d="M300 406H375V246" fill="none" stroke="#142d32" stroke-width="2"/>
<circle cx="375" cy="246" r="3.5" fill="#142d32"/>
<path d="M526 246V348" fill="none" stroke="#142d32" stroke-width="2"/>
<path d="M526 348H526V358" fill="none" stroke="#142d32" stroke-width="2"/>
<rect x="521" y="358" width="10" height="28" rx="0" fill="#fffef9" stroke="#142d32"/>
<path d="M526 386H526V396" fill="none" stroke="#142d32" stroke-width="2"/>
<text x="539" y="376" font-size="11" fill="#142d32" style="fill:#142d32" font-weight="normal" text-anchor="start">4.7 kΩ</text>
<text x="523" y="420" font-size="11" fill="#142d32" style="fill:#142d32" font-weight="normal" text-anchor="middle">to +5V</text>
<path d="M660 246V416" fill="none" stroke="#142d32" stroke-width="2"/>
<rect x="480" y="456" width="260" height="105" rx="10" fill="#f4f2eb" stroke="#d7dfd6"/>
<text x="495" y="483" font-size="15" fill="#142d32" style="fill:#142d32" font-weight="bold" text-anchor="start">Q1 · 2N3904 disarm</text>
<text x="495" y="507" font-size="12" fill="#142d32" style="fill:#142d32" font-weight="normal" text-anchor="start">Collector = CLEAR_N; emitter = GND</text>
<text x="495" y="527" font-size="12" fill="#142d32" style="fill:#142d32" font-weight="normal" text-anchor="start">GP5 → 10 kΩ → base</text>
<text x="495" y="547" font-size="12" fill="#142d32" style="fill:#142d32" font-weight="normal" text-anchor="start">100 kΩ base to emitter</text>
<path d="M660 416V456" fill="none" stroke="#142d32" stroke-width="2"/>
<circle cx="660" cy="246" r="3.5" fill="#142d32"/>
<rect x="46" y="590" width="328" height="130" rx="10" fill="#f4f2eb" stroke="#d7dfd6"/>
<text x="61" y="617" font-size="15" fill="#142d32" style="fill:#142d32" font-weight="bold" text-anchor="start">VREF · nominal 0.996 V</text>
<text x="61" y="641" font-size="12" fill="#142d32" style="fill:#142d32" font-weight="normal" text-anchor="start">+5V → 40.2 kΩ → VREF → 10 kΩ → GND</text>
<text x="61" y="661" font-size="12" fill="#142d32" style="fill:#142d32" font-weight="normal" text-anchor="start">100 nF from VREF to GND</text>
<text x="61" y="681" font-size="12" fill="#142d32" style="fill:#142d32" font-weight="normal" text-anchor="start">At 0.825 V/A: trip ≈1.21 A/channel</text>
<text x="61" y="701" font-size="12" fill="#142d32" style="fill:#142d32" font-weight="normal" text-anchor="start">Calibrate actual sense gain and threshold.</text>
<rect x="438" y="602" width="336" height="118" rx="10" fill="#f4f2eb" stroke="#d7dfd6"/>
<text x="453" y="629" font-size="15" fill="#142d32" style="fill:#142d32" font-weight="bold" text-anchor="start">S1 · two linked contacts</text>
<text x="453" y="653" font-size="12" fill="#142d32" style="fill:#142d32" font-weight="normal" text-anchor="start">NC: disconnect +15V track supply (sheet 01)</text>
<text x="453" y="673" font-size="12" fill="#142d32" style="fill:#142d32" font-weight="normal" text-anchor="start">NO: ground CLEAR_N when pressed</text>
<text x="453" y="693" font-size="12" fill="#142d32" style="fill:#142d32" font-weight="normal" text-anchor="start">Rated for ≥30 V DC / 3 A; verify contacts</text>
<rect x="816" y="552" width="337" height="168" rx="10" fill="#f4f2eb" stroke="#d7dfd6"/>
<text x="831" y="579" font-size="15" fill="#142d32" style="fill:#142d32" font-weight="bold" text-anchor="start">Latch behavior</text>
<text x="831" y="603" font-size="12" fill="#142d32" style="fill:#142d32" font-weight="normal" text-anchor="start">Any trip drives CLEAR_N low → Q = 0.</text>
<text x="831" y="623" font-size="12" fill="#142d32" style="fill:#142d32" font-weight="normal" text-anchor="start">/Q = 1 disables U1; EN pull-downs stop bridge.</text>
<text x="831" y="643" font-size="12" fill="#142d32" style="fill:#142d32" font-weight="normal" text-anchor="start">Current going away does not re-arm.</text>
<text x="831" y="663" font-size="12" fill="#142d32" style="fill:#142d32" font-weight="normal" text-anchor="start">A new GP4 rising edge is required.</text>
<text x="831" y="683" font-size="12" fill="#142d32" style="fill:#142d32" font-weight="normal" text-anchor="start">Unused FF2: D/CLK GND; /PRE,/CLR +5V.</text>
<text x="46" y="745" font-size="12" fill="#a34030" style="fill:#a34030" font-weight="normal" text-anchor="start">This is not a measured short-circuit response. Validate trip delay, overshoot, thermal behavior and all fault paths.</text>
</svg>
