<text x="68" y="370" font-size="12" fill="#142d32" style="fill:#142d32" font-weight="normal" text-anchor="start">GP6 / pin 9 · EN-A</text>
<text x="480" y="370" font-size="12" fill="#142d32" style="fill:#142d32" font-weight="normal" text-anchor="start">Channel 3: 9 → 8</text>
<text x="880" y="370" font-size="12" fill="#142d32" style="fill:#142d32" font-weight="normal" text-anchor="start">D3 · PWMA / ENA</text>
<path d="M315 366H456V366" fill="none" stroke="#437d65" stroke-width="2"/>
<text x="386" y="358" font-size="11" fill="#142d32" style="fill:#142d32" font-weight="normal" text-anchor="middle">in 9</text>
<path d="M721 366H864V366" fill="none" stroke="#b56a28" stroke-width="2"/>
<text x="790" y="358" font-size="11" fill="#142d32" style="fill:#142d32" font-weight="normal" text-anchor="middle">out 8</text>
<text x="68" y="406" font-size="12" fill="#142d32" style="fill:#142d32" font-weight="normal" text-anchor="start">GP7 / pin 10 · EN-B</text>
<text x="480" y="406" font-size="12" fill="#142d32" style="fill:#142d32" font-weight="normal" text-anchor="start">Channel 4: 12 → 11</text>
<text x="880" y="406" font-size="12" fill="#142d32" style="fill:#142d32" font-weight="normal" text-anchor="start">D11 · PWMB / ENB</text>
<path d="M315 402H456V402" fill="none" stroke="#437d65" stroke-width="2"/>
<text x="386" y="394" font-size="11" fill="#142d32" style="fill:#142d32" font-weight="normal" text-anchor="middle">in 12</text>
<path d="M721 402H864V402" fill="none" stroke="#b56a28" stroke-width="2"/>
<text x="790" y="394" font-size="11" fill="#142d32" style="fill:#142d32" font-weight="normal" text-anchor="middle">out 11</text>
<text x="65" y="438" font-size="11" fill="#142d32" style="fill:#142d32" font-weight="normal" text-anchor="start">GP4 ARM, GP5 DISARM → sheet 03</text>
<text x="879" y="438" font-size="11" fill="#142d32" style="fill:#142d32" font-weight="normal" text-anchor="start">D9 BRAKEA + D8 BRAKEB → GND</text>
<text x="50" y="479" font-size="12" fill="#142d32" style="fill:#142d32" font-weight="normal" text-anchor="start">ENA and ENB: 10 kΩ to GND at shield inputs. U1 OE = BUFFER_DISABLE from U2 /Q on sheet 03.</text>
<text x="50" y="505" font-size="12" fill="#a34030" style="fill:#a34030" font-weight="normal" text-anchor="start">U1 high-impedance outputs must never leave the bridge enables high or floating.</text>
<text x="50" y="545" font-size="13" fill="#142d32" style="fill:#142d32" font-weight="normal" text-anchor="start">Shield A0 / SNSA</text>
