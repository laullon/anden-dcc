<text x="790" y="286" font-size="11" fill="#142d32" style="fill:#142d32" font-weight="normal" text-anchor="middle">out 3</text>
<text x="68" y="334" font-size="12" fill="#142d32" style="fill:#142d32" font-weight="normal" text-anchor="start">GP3 / pin 5 · DCC-B</text>
<text x="480" y="334" font-size="12" fill="#142d32" style="fill:#142d32" font-weight="normal" text-anchor="start">Channel 2: 5 → 6</text>
<text x="880" y="334" font-size="12" fill="#142d32" style="fill:#142d32" font-weight="normal" text-anchor="start">D13 · DIRB</text>
