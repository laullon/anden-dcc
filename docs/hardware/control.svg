<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850">
<rect width="1200" height="850" fill="#fffef9"/>
<style>text{font-family:Arial,sans-serif;fill:#142d32} .mono{font-family:monospace}</style>
<text x="42" y="40" font-size="14" fill="#142d32" style="fill:#142d32" font-weight="bold" text-anchor="start">anden-dcc / HARDWARE</text>
<text x="1158" y="40" font-size="13" fill="#142d32" style="fill:#142d32" font-weight="normal" text-anchor="end">02 / REV A</text>
<text x="42" y="86" font-size="29" fill="#142d32" style="fill:#142d32" font-weight="bold" text-anchor="start">Control and current sensing.</text>
<text x="42" y="116" font-size="13" fill="#647676" style="fill:#647676" font-weight="normal" text-anchor="start">5 V TTL-compatible translation · bridge enable defaults low · no rail connected to logic ground</text>
<path d="M42 139H1158V139" fill="none" stroke="#d7dfd6" stroke-width="1"/>
<rect x="42" y="768" width="1116" height="47" rx="8" fill="#f8e9da" stroke="#d7dfd6"/>
<text x="58" y="790" font-size="12" fill="#a34030" style="fill:#a34030" font-weight="bold" text-anchor="start">PROPOSED POWER ASSEMBLY · NOT BUILT OR ELECTRICALLY VALIDATED</text>
<text x="58" y="807" font-size="11" fill="#142d32" style="fill:#142d32" font-weight="normal" text-anchor="start">Firmware 0.5.0 drives GP2 only. Other pins are reservations. See hardware README and sources before assembly.</text>
<rect x="50" y="176" width="265" height="276" rx="10" fill="#f4f2eb" stroke="#d7dfd6"/>
<text x="65" y="203" font-size="15" fill="#142d32" style="fill:#142d32" font-weight="bold" text-anchor="start">M1 · Pico W</text>
<text x="65" y="227" font-size="12" fill="#142d32" style="fill:#142d32" font-weight="normal" text-anchor="start">3.3 V GPIO; common GND</text>
<text x="65" y="247" font-size="12" fill="#142d32" style="fill:#142d32" font-weight="normal" text-anchor="start">GP2 active; other outputs reserved</text>
<rect x="456" y="176" width="265" height="276" rx="10" fill="#f4f2eb" stroke="#d7dfd6"/>
<text x="471" y="203" font-size="15" fill="#142d32" style="fill:#142d32" font-weight="bold" text-anchor="start">U1 · SN74AHCT125N</text>
<text x="471" y="227" font-size="12" fill="#142d32" style="fill:#142d32" font-weight="normal" text-anchor="start">5 V supply: pin 14; GND: pin 7</text>
<text x="471" y="247" font-size="12" fill="#142d32" style="fill:#142d32" font-weight="normal" text-anchor="start">OE 1/4/10/13 = BUFFER_DISABLE</text>
<text x="471" y="267" font-size="12" fill="#142d32" style="fill:#142d32" font-weight="normal" text-anchor="start">10 kΩ pull-down at each input</text>
<rect x="864" y="176" width="287" height="276" rx="10" fill="#f4f2eb" stroke="#d7dfd6"/>
<text x="879" y="203" font-size="15" fill="#142d32" style="fill:#142d32" font-weight="bold" text-anchor="start">M2 · Deek-Robot L298P</text>
<text x="879" y="227" font-size="12" fill="#142d32" style="fill:#142d32" font-weight="normal" text-anchor="start">5 V logic supply / common GND</text>
<text x="879" y="247" font-size="12" fill="#142d32" style="fill:#142d32" font-weight="normal" text-anchor="start">10 kΩ pull-down at ENA and ENB</text>
<text x="68" y="298" font-size="12" fill="#142d32" style="fill:#142d32" font-weight="normal" text-anchor="start">GP2 / pin 4 · DCC-A</text>
<text x="480" y="298" font-size="12" fill="#142d32" style="fill:#142d32" font-weight="normal" text-anchor="start">Channel 1: 2 → 3</text>
<text x="880" y="298" font-size="12" fill="#142d32" style="fill:#142d32" font-weight="normal" text-anchor="start">D12 · DIRA</text>
<path d="M315 294H456V294" fill="none" stroke="#437d65" stroke-width="2"/>
<text x="386" y="286" font-size="11" fill="#142d32" style="fill:#142d32" font-weight="normal" text-anchor="middle">in 2</text>
